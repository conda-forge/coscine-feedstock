{% set python_min = "3.10" %}
{% set name = "coscine" %}
{% set version = "0.12.2" %}
{% set sha256 = "97a7480c93115f7b58b17e75fc7b21a6996b350675688083c8aeb89ff2487e19" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - pydantic
  run:
    - python >={{ python_min }}
    - setuptools
    - boto3
    - pyshacl
    - python-dateutil
    - rdflib
    - requests
    - requests-cache >=1.2.1,<1.3.0
    - requests-toolbelt
    - tabulate
    - tqdm
    - pydantic

test:
  imports:
    - coscine
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://git.rwth-aachen.de/coscine/community-features/coscine-python-sdk
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: A Python Software Development Kit for Coscine.
  description: |
    The Coscine Python SDK provides a high-level interface
    to the Coscine REST API.
  doc_url: https://coscine.pages.rwth-aachen.de/community-features/coscine-python-sdk
  dev_url: https://git.rwth-aachen.de/coscine/community-features/coscine-python-sdk

extra:
  recipe-maintainers:
    - palomena
    - niklassiemer
